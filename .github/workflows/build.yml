name: Build Tapasya APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract Tapasya project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source

      - name: Find and build Android project
        run: |
          PROJECT_DIR=$(dirname "$(find source -type f -name gradlew | head -1)")
          echo "Project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -1)
          echo "APK Found: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tapasya-debug-APK
          path: app-debug.apk
