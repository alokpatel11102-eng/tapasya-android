name: Prepare and Build Ekavo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          echo "Using ZIP: $ZIP_FILE"
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Copy project files to repository
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -type f -name gradlew | head -1)")
          echo "Project directory: $PROJECT_DIR"
          cp -a "$PROJECT_DIR/." ./
          rm -rf extracted

      - name: Save project files to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41998282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update Ekavo Android project source"
          git push

      - name: Create release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/tapasya-upload.jks" \
            -storetype JKS \
            -alias tapasya-upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Tapasya, OU=Mobile, O=Tapasya, L=India, ST=Bihar, C=IN"

      - name: Build signed Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew

          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/tapasya-upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="tapasya-upload" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Tapasya-release-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Tapasya-upload-keystore
          path: tapasya-upload.jks
